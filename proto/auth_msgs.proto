syntax = "proto3";

package grpcsso;

import "validate/validate.proto";

option go_package = "github.com/dmi3midd/grpcsso-protos/gen/go/grpcssov1";

message RegistrationRequest {
  string username = 1 [
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 32
  ];
  string email = 2 [(buf.validate.field).string.email = true];
  string password = 3 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 64
  ];
}

message RegistrationResponse {
    string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message User {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string username = 2 [
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 32
  ];
  string email = 3 [(buf.validate.field).string.email = true];
}

message LoginResponse {
  User user = 1 [(buf.validate.field).required = true];
  string access_token = 2 [(buf.validate.field).required = true];
  string refresh_token = 3 [(buf.validate.field).required = true];
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message LogoutResponse {}

message RefreshRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message RefreshResponse {
  User user = 1 [(buf.validate.field).required = true];
  string access_token = 2 [(buf.validate.field).required = true];
  string refresh_token = 3 [(buf.validate.field).required = true];
}
