syntax = "proto3";

package grpcsso;

option go_package = "github.com/dmi3midd/grpcsso-protos/gen/go/grpcssov1";

message RegistrationRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegistrationResponse {
    string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message User {
  string user_id = 1;
  string username = 2;
  string email = 3;
}

message LoginResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}
